<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Матрица Эйзенхауэра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f3f4fa; --card:#ffffff; --text:#141726; --muted:#7b809a; --line:rgba(20,24,40,.08);
  --shadow:0 6px 24px rgba(30,35,70,.08);
  --do:#ff5a5f; --plan:#3d8bfd; --delegate:#f5a524; --drop:#9b7bf7;
}
[data-theme="dark"]{
  --bg:#0e1016; --card:#171a23; --text:#f1f2f8; --muted:#8a8fa8; --line:rgba(255,255,255,.07);
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{padding:18px 14px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* header */
.hello{font-size:14px;color:var(--muted);margin:2px 2px 2px}
.h1{font-size:26px;font-weight:750;letter-spacing:-.02em;margin:0 2px 14px}
.stats{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip b{font-weight:800}
.chip.red{color:var(--do)} .chip.amber{color:var(--delegate)}

/* tabs */
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 14px;gap:4px}
.tab{flex:1;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:.2s;white-space:nowrap}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 10px 10px;box-shadow:var(--shadow);margin-bottom:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-h b{font-size:16px;font-weight:750}
.cal-h button{width:34px;height:34px;border-radius:10px;font-size:20px;color:var(--muted);background:var(--bg)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-w{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-d{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14.5px;font-weight:600;position:relative}
.cal-d.o{opacity:.3}
.cal-d.t{color:var(--plan);font-weight:800}
.cal-d.s{background:linear-gradient(135deg,#6d6bff,#3d8bfd);color:#fff}
.cal-dots{display:flex;gap:3px;margin-top:4px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal-d.s .cal-dots i{background:#fff}
.cal-d .ov{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--do)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.day-h b{font-size:17px;font-weight:750}
.day-h small{font-size:12.5px;color:var(--muted)}
.addday{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:14px}
.tab.on{background:linear-gradient(135deg,#6d6bff,#3d8bfd);color:#fff;box-shadow:0 4px 14px rgba(61,139,253,.3)}

/* habits */
.habits{display:flex;flex-direction:column;gap:10px}
.hcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);animation:pop .2s ease}
.hcheck{flex:none;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.hcheck.on{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.hcheck.on::after{content:"";width:14px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.hcheck.no{border-color:color-mix(in srgb,var(--do) 45%,transparent)}
.hbody{flex:1;min-width:0;text-align:left}
.htitle{font-size:15.5px;font-weight:650;word-wrap:break-word}
.hmeta{font-size:12.5px;color:var(--muted);margin-top:3px}
.hweek{display:flex;gap:5px;margin-top:8px}
.hweek i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.hweek i.y{background:#22c55e}
.hweek i.n{background:color-mix(in srgb,var(--do) 55%,transparent)}
.hweek i.t{outline:2px solid color-mix(in srgb,#22c55e 45%,transparent);outline-offset:1px}
.hstreak{flex:none;font-size:13px;font-weight:800;color:#f97316;min-width:34px;text-align:right}
.hstreak.z{color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:10px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px}
.seg button.sel{border-color:var(--plan);background:color-mix(in srgb,var(--plan) 14%,var(--card));color:var(--plan)}
.times{display:flex;gap:8px}
.times .inp{flex:1;min-width:0}

/* progress */
.prog{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .rb{stroke:var(--line)}
.ring .rf{stroke:#5b7cfa;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pt b{font-size:15px;font-weight:700}
.pt small{font-size:12.5px;color:var(--muted)}
.pt .red{color:var(--do);font-weight:600}

/* matrix */
.matrix{display:grid;grid-template-columns:16px 1fr 1fr;grid-template-rows:auto auto auto;gap:10px}
.ax{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.ax-l{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center}
.q{position:relative;overflow:hidden;border-radius:22px;padding:14px 13px 12px;min-height:178px;text-align:left;
  background:var(--card);
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 20%,var(--card)) 0%,var(--card) 72%);
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .15s}
.q:active{transform:scale(.97)}
.q::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:var(--c);opacity:.12;filter:blur(4px)}
.q-head{display:flex;justify-content:space-between;align-items:center}
.q-emoji{font-size:22px}
.q-count{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--c);color:#fff;
  font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.q-title{font-weight:750;font-size:15.5px;margin-top:10px;letter-spacing:-.01em}
.q-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.q-prev{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.q-prev li{font-size:12.5px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-prev li span.t{overflow:hidden;text-overflow:ellipsis}
.q-prev .empty{color:var(--muted);font-style:italic}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.dot.over{background:var(--do);box-shadow:0 0 0 3px color-mix(in srgb,var(--do) 25%,transparent)}
.more{font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:6px}

/* hot section */
.sec{margin:26px 2px 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.task.done .check{background:var(--c)}
.task.done .check::after{content:"";width:10px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.t-body{flex:1;min-width:0;text-align:left}
.t-title{font-size:15px;font-weight:600;line-height:1.3;word-wrap:break-word}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-note{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35;word-wrap:break-word}
.t-meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.over{background:color-mix(in srgb,var(--do) 16%,transparent);color:var(--do)}
.badge.today{background:color-mix(in srgb,var(--delegate) 18%,transparent);color:#d98a00}
.badge.soon{background:color-mix(in srgb,var(--plan) 15%,transparent);color:var(--plan)}
.badge.qb{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}

/* list view */
.lh{display:flex;align-items:center;gap:12px;margin:4px 2px 18px}
.lh .big{width:52px;height:52px;border-radius:16px;font-size:26px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 18%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.lh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.lh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.backbtn{font-size:15px;color:var(--plan);font-weight:600;margin:0 2px 12px;display:inline-block}
.hint{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center}
.ghost{display:block;margin:16px auto 0;font-size:14px;color:var(--muted);font-weight:600;padding:8px 12px}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;
  background:linear-gradient(135deg,#6d6bff,#3d8bfd);color:#fff;font-size:32px;font-weight:300;
  box-shadow:0 10px 28px rgba(61,139,253,.45);display:flex;align-items:center;justify-content:center;z-index:5;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(10,12,20,.45);opacity:0;transition:opacity .25s}
.sheet.open .backdrop{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);
  border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.panel h3{margin:0 0 14px;font-size:19px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;outline:none;margin-bottom:10px;resize:none}
.inp:focus{border-color:var(--plan)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:8px 2px 8px}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.qopt{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;gap:8px;align-items:center;background:var(--bg)}
.qopt .e{font-size:18px}
.qopt .n{font-size:13.5px;font-weight:700;line-height:1.15}
.qopt .s{font-size:11px;color:var(--muted)}
.qopt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qk{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.qk.sel{background:var(--plan);color:#fff;border-color:var(--plan)}
.row{display:flex;gap:8px}
.row .inp{flex:1;min-width:0}
.acts{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:15px;border-radius:16px;font-weight:700;font-size:16px}
.btn.primary{background:linear-gradient(135deg,#6d6bff,#3d8bfd);color:#fff}
.btn.danger{flex:0 0 auto;padding:15px 18px;background:color-mix(in srgb,var(--do) 14%,transparent);color:var(--do)}
.btn:disabled{opacity:.45}

/* toast */
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:30;background:var(--text);color:var(--bg);
  font-size:14px;font-weight:700;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Добавить">+</button>
<div class="toast" id="toast"></div>

<div class="sheet" id="hsheet">
  <div class="backdrop" id="hbackdrop"></div>
  <div class="panel">
    <div class="grab"></div>
    <h3 id="hTitleH">Новая привычка</h3>
    <input class="inp" id="hTitle" placeholder="Например: читать по утрам" maxlength="100" autocomplete="off">
    <div class="lbl">Напоминать в день</div>
    <div class="seg" id="hCount">
      <button data-hcount="0">Нет</button><button data-hcount="1">1 раз</button><button data-hcount="2">2 раза</button><button data-hcount="3">3 раза</button>
    </div>
    <div class="times" id="hTimes"></div>
    <div class="acts">
      <button class="btn danger" id="hDel">Удалить</button>
      <button class="btn primary" id="hSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="backdrop" id="backdrop"></div>
  <div class="panel">
    <div class="grab"></div>
    <h3 id="sTitle">Новая задача</h3>
    <input class="inp" id="fTitle" placeholder="Что нужно сделать?" maxlength="140" autocomplete="off">
    <textarea class="inp" id="fNote" rows="2" placeholder="Заметка (необязательно)" maxlength="500"></textarea>
    <div class="lbl">Квадрант</div>
    <div class="qpick" id="fQ"></div>
    <div class="lbl">Дедлайн</div>
    <div class="quick" id="fQuick">
      <button class="qk" data-quick="0">Сегодня</button>
      <button class="qk" data-quick="1">Завтра</button>
      <button class="qk" data-quick="2">Послезавтра</button>
      <button class="qk" data-quick="7">Неделя</button>
      <button class="qk" data-quick="m">Месяц</button>
      <button class="qk" data-quick="none">Без срока</button>
    </div>
    <div class="row">
      <input class="inp" type="date" id="fDate">
      <input class="inp" type="time" id="fTime">
    </div>
    <div class="acts">
      <button class="btn danger" id="fDel">Удалить</button>
      <button class="btn primary" id="fSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));

const Q = [
  {id:'do',       title:'Сделать сейчас', sub:'Срочно · Важно',        emoji:'🔥', c:'var(--do)'},
  {id:'plan',     title:'Запланировать',  sub:'Не срочно · Важно',     emoji:'🎯', c:'var(--plan)'},
  {id:'delegate', title:'Делегировать',   sub:'Срочно · Не важно',     emoji:'🤝', c:'var(--delegate)'},
  {id:'drop',     title:'Отложить',       sub:'Не срочно · Не важно',  emoji:'🌙', c:'var(--drop)'},
];
const QM = Object.fromEntries(Q.map(q=>[q.id,q]));

let tasks = [];
let habits = [];
let tab = 'tasks';   // 'tasks' | 'habits'
let view = null;       // id квадранта или null (главный экран)
let editing = null;    // id редактируемой задачи
let showDone = false;
let form = {q:'do'};

/* ---------- хранение ---------- */
const KEY = 'eis_tasks', CHUNK = 4000;
const cloud = () => ver('6.9') && tg.CloudStorage;
const cGet = keys => new Promise(r => tg.CloudStorage.getItems(keys, (e,v) => r(e ? {} : (v||{}))));
const cSet = (k,v) => new Promise(r => tg.CloudStorage.setItem(k, v, () => r()));

async function load(){
  let local = [];
  try { local = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){}
  tasks = local;
  if (cloud()){
    try{
      const m = await cGet([KEY+'_n']);
      const n = parseInt(m[KEY+'_n'] || '0', 10);
      if (n > 0){
        const keys = Array.from({length:n}, (_,i) => KEY+'_'+i);
        const v = await cGet(keys);
        tasks = JSON.parse(keys.map(k => v[k] || '').join(''));
      }
    }catch(e){ tasks = local; }
  }
}
const HKEY = 'eis_habits';
async function loadHabits(){
  let local = [];
  try { local = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch(e){}
  habits = local;
  if (cloud()){
    try{
      const m = await cGet([HKEY+'_n']);
      const n = parseInt(m[HKEY+'_n'] || '0', 10);
      if (n > 0){
        const keys = Array.from({length:n}, (_,i) => HKEY+'_'+i);
        const v = await cGet(keys);
        habits = JSON.parse(keys.map(k => v[k] || '').join(''));
      }
    }catch(e){ habits = local; }
  }
}
async function saveHabitsLocal(){
  const s = JSON.stringify(habits);
  try { localStorage.setItem(HKEY, s); } catch(e){}
  if (cloud()){
    const parts = [];
    for (let i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i+CHUNK));
    if (!parts.length) parts.push('[]');
    for (let i = 0; i < parts.length; i++) await cSet(HKEY+'_'+i, parts[i]);
    await cSet(HKEY+'_n', String(parts.length));
  }
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { saveLocal(); saveHabitsLocal(); }, 250); scheduleSync(); }
async function saveLocal(){
  const s = JSON.stringify(tasks);
  try { localStorage.setItem(KEY, s); } catch(e){}
  if (cloud()){
    const parts = [];
    for (let i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i+CHUNK));
    if (!parts.length) parts.push('[]');
    for (let i = 0; i < parts.length; i++) await cSet(KEY+'_'+i, parts[i]);
    await cSet(KEY+'_n', String(parts.length));
  }
}

/* ---------- задачи из чата с ботом ---------- */
// Бот кладёт последние задачи в ссылку кнопки меню: ?inbox=<base64>.
// Забираем новые, а их id запоминаем, чтобы не добавить повторно.
const QC = {d:'do', p:'plan', g:'delegate', x:'drop'};
const SEEN = 'eis_seen';
function b64dec(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
}
async function loadSeen(){
  let v = null;
  if (cloud()){ try{ v = (await cGet([SEEN]))[SEEN]; }catch(e){} }
  if (!v){ try{ v = localStorage.getItem(SEEN); }catch(e){} }
  try { return JSON.parse(v || '[]'); } catch(e){ return []; }
}
async function saveSeen(arr){
  const s = JSON.stringify(arr.slice(-250));
  try{ localStorage.setItem(SEEN, s); }catch(e){}
  if (cloud()) await cSet(SEEN, s);
}
async function importInbox(){
  let items;
  try{
    const raw = new URLSearchParams(location.search).get('inbox');
    if (!raw) return 0;
    items = JSON.parse(b64dec(raw));
    if (!Array.isArray(items)) return 0;
  }catch(e){ return 0; }
  const seenArr = await loadSeen(), seen = new Set(seenArr);
  let added = 0;
  for (const it of items){
    const [id, title, qc, date, time] = it;
    if (!id || !title || seen.has(id)) continue;
    seen.add(id); seenArr.push(id);
    if (tasks.some(t => t.id === id)) continue;
    tasks.push({id, title:String(title), note:'', q:QC[qc] || 'do', date:date || '', time:date ? (time || '') : '', done:false, created:Date.now(), updated:Date.now()});
    added++;
  }
  await saveSeen(seenArr);
  if (added) save();
  return added;
}

function scheduleSync(ms = 1200){ clearTimeout(syncT); syncT = setTimeout(sync, ms); }
async function sync(){

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function quickDate(v){
  const x = new Date();
  if (v === 'm'){ const d = x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+1); x.setDate(Math.min(d, new Date(x.getFullYear(), x.getMonth()+1, 0).getDate())); }
  else x.setDate(x.getDate() + +v);
  return ymd(x);
}
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const n1=n%10; return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c; };
const haptic = (t='light') => { try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); }catch(e){} };
const notify = (t='success') => { try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); }catch(e){} };

function dueDate(t){ return t.date ? new Date(t.date + 'T' + (t.time || '23:59')) : null; }
function deadline(t){
  const d = dueDate(t); if (!d) return null;
  const now = new Date();
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const days = Math.round((dd - t0) / 86400000);
  const tm = t.time ? ', ' + t.time : '';
  const date = d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
  if (!t.done && d < now) return {cls:'over', text: days===0 ? 'Просрочено' + tm : 'Просрочено · ' + date};
  if (days === 0) return {cls:'today', text:'Сегодня' + tm};
  if (days === 1) return {cls:'soon', text:'Завтра' + tm};
  if (days > 1 && days < 7) return {cls:'soon', text:`Через ${days} ${plural(days,'день','дня','дней')}`};
  return {cls:'', text: date + tm};
}
function isOver(t){ const d = dueDate(t); return !t.done && d && d < new Date(); }
function sortT(a,b){
  if (a.done !== b.done) return a.done ? 1 : -1;
  const da = dueDate(a), db = dueDate(b);
  if (da && db) return da - db;
  if (da) return -1; if (db) return 1;
  return b.created - a.created;
}

const QCOL = {do:'var(--do)', plan:'var(--plan)', delegate:'var(--delegate)', drop:'var(--drop)'};

const dayKey = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
function hStreak(h){

}

  const d = el.dataset;
  if (d.tab){ if (tab !== d.tab){ tab = d.tab; view = null; haptic(); render(); window.scrollTo(0,0); } return; }
  if (d.calnav){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +d.calnav, 1); haptic(); render(); return; }
  if (d.calday){ calSel = d.calday; const c = new Date(d.calday + 'T12:00:00'); if (c.getMonth() !== calMonth.getMonth()) calMonth = new Date(c.getFullYear(), c.getMonth(), 1); haptic(); render(); return; }
  if (d.caladd){ haptic('medium'); openSheet(null, null, d.caladd); return; }
  if (d.hcheck){ toggleHabit(d.hcheck); return; }
  if (d.hedit){ haptic(); openHSheet(d.hedit); return; }
  if (d.hcount !== undefined){ hForm.count = +d.hcount; hForm.times = [...DEF_TIMES[hForm.count]]; haptic(); renderHForm(); return; }
  if (d.open){ view = d.open; showDone = false; haptic(); render(); window.scrollTo(0,0); }
  else if (d.check){ const t = tasks.find(x => x.id === d.check); t.done = !t.done; t.doneAt = t.done ? Date.now() : null; t.updated = Date.now(); t.done ? notify() : haptic(); save(); render(); }
  else if (d.edit){ haptic(); openSheet(d.edit); }
  else if (d.back !== undefined){ goBack(); }
  else if (d.pick){ form.q = d.pick; haptic(); renderQPick(); }
  else if (d.quick){
    haptic();
    if (d.quick === 'none'){ $('fDate').value = ''; $('fTime').value = ''; }
    else $('fDate').value = quickDate(d.quick);
    markQuick();
  }
  else if (d.toggleDone !== undefined){ showDone = !showDone; render(); }
  else if (d.clearDone !== undefined){
    const go = () => { tombstone(t => t.q === view && t.done); save(); render(); };
    if (ver('6.2')) tg.showConfirm('Удалить все выполненные задачи в этом квадранте?', ok => ok && go()); else go();
  }
});
function goBack(){ if (isHSheetOpen()) closeHSheet(); else if (isSheetOpen()) closeSheet(); else if (view){ view = null; render(); } }
$('fab').onclick = () => { haptic('medium'); tab === 'habits' ? openHSheet(null) : openSheet(null, null, tab === 'cal' ? calSel : ''); };
$('hbackdrop').onclick = closeHSheet;
$('hSave').onclick = saveHForm;
$('hDel').onclick = delHabit;
$('hTitle').onkeydown = e => { if (e.key === 'Enter') saveHForm(); };
$('hTimes').addEventListener('change', e => { const i = e.target.dataset.htime; if (i !== undefined) hForm.times[+i] = e.target.value; });
$('backdrop').onclick = closeSheet;
$('fSave').onclick = saveForm;
$('fDel').onclick = () => delTask(editing);
$('fTitle').oninput = updSave;
$('fTitle').onkeydown = e => { if (e.key === 'Enter') saveForm(); };
$('fDate').onchange = markQuick;

/* ---------- тема и запуск ---------- */
function applyTheme(){
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (ver('6.1')){ const bg = dark ? '#0e1016' : '#f3f4fa'; try{ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }catch(e){} }
}
(async function init(){
  applyTheme();
  if (tg){
    tg.ready(); tg.expand();
    tg.onEvent('themeChanged', applyTheme);
    if (ver('6.1')) tg.BackButton.onClick(goBack);
  }
  await load();
  await loadHabits();
  if (location.hash === '#habits') tab = 'habits';
  if (location.hash === '#calendar') tab = 'cal';
  const added = await importInbox();
  render();
  if (added){ notify(); toast(`📥 Из чата: +${added} ${plural(added,'задача','задачи','задач')}`); }
  sync();
  setInterval(() => { if (!isSheetOpen() && !isHSheetOpen()) render(); sync(); }, 60000); // обновлять «сегодня/просрочено» и синхронизироваться
  if (tg) tg.onEvent('activated', sync);
})();
</script>
